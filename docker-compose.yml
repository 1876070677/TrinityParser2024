version: '3'
services:
  redis:
    container_name: trinity-redis
    image: redis:latest
    ports:
      - 6379:6379
    networks:
      - gajang-net

  mysql:
    container_name: trinity-mysql
    image: mysql:8.0.30
    volumes:
      - ./db/conf.d:/etc/mysql/conf.d
      - ./db/initdb.d:/docker-entrypoint-initdb.d
    ports:
      - 3306:3306
    env_file: ./db/.env

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 9002-9003:8080
    depends_on:
      - redis
      - mysql
    networks:
      - gajang-net
    
  frontend:
    build:
      context: ./frontend
    networks:
      - gajang-net
    ports:
      - 5173:5173

  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 9005-9006:8080
    depends_on:
      - redis
    networks:
      - gajang-net

networks:
  gajang-net:
    driver: bridge
